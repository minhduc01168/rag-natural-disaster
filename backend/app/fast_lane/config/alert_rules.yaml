# Alert Rules Configuration
# Thresholds for weather alert classification

green:
  name: "An toàn"
  description: "Thời tiết bình thường, an toàn cho hoạt động ngoài trời"
  temp_range: [15, 35]
  humidity_range: [30, 80]
  wind_speed_max: 30
  rainfall_max: 10
  recommendations:
    - "Thời tiết thuận lợi cho hoạt động ngoài trời"
    - "Vẫn nên theo dõi dự báo thời tiết"

yellow:
  name: "Cảnh giác"
  description: "Thời tiết có dấu hiệu bất thường, cần chú ý"
  temp_range: [10, 40]
  humidity_range: [20, 90]
  wind_speed_max: 60
  rainfall_max: 50
  recommendations:
    - "Hạn chế hoạt động ngoài trời"
    - "Chuẩn bị đồ dùng phòng mưa"
    - "Theo dõi cập nhật thời tiết thường xuyên"

red:
  name: "Nguy hiểm"
  description: "Thời tiết cực đoan, nguy hiểm đến tính mạng"
  temp_range: [-10, 50]
  humidity_range: [0, 100]
  wind_speed_max: 120
  rainfall_max: 200
  recommendations:
    - "Ở trong nhà, không ra ngoài"
    - "Di chuyển đến nơi an toàn nếu ở vùng trũng"
    - "Chuẩn bị đồ dùng khẩn cấp"
    - "Liên hệ cứu nạn nếu cần thiết"
